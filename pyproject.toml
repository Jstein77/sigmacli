[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-sdlc"
version = "0.1.0"
description = "CLI tool for managing Sigma data models with Git workflows"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "GitPython>=3.1.0",
]

[project.scripts]
sigma-sdlc = "sigma_sdlc.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "responses>=0.24.0",
    "pytest-cov>=4.1.0",
]
