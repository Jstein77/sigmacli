[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-computing-cli"
version = "0.1.0"
description = "CLI tool for managing Sigma data models with Git workflows"
license = "Apache-2.0"
authors = [{name = "Sigma Computing"}]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
"Topic :: Software Development :: Version Control",
]
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "GitPython>=3.1.0",
]

[project.scripts]
sigma = "sigma_sdlc.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/sigmacomputing/sigma-sdlc"
Repository = "https://github.com/sigmacomputing/sigma-sdlc"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "responses>=0.24.0",
    "pytest-cov>=4.1.0",
]
